<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>One Last Question</title>

    <link
        rel="stylesheet"
        href="styles.css"
    >
</head>

<body>

    <main class="page-container">

        <section class="card question-card">

            <div class="eyebrow">
                ONE LAST QUESTION
            </div>

            <h1 class="confirmation-message">
    So Ellisha, do you want to go out and have some fun with your Secret Nerd?
</h1>

            <p class="question-subtitle">
                Saying yes would make him the luckiest guy!!! So… pretty please? 🥺👉🏻👈🏻
            </p>

            <div class="question-actions">

                <button
                    type="button"
                    id="yesButton"
                    class="primary-button"
                >
                    <span>Yes, absolutely</span>
                    <span class="button-arrow">→</span>
                </button>

                <button
                    type="button"
                    id="noButton"
                    class="no-button"
                >
                    No
                </button>

            </div>

        </section>

    </main>


    <script src="confirm.js"></script>

</body>

</html>
